# PPO residual-policy training (M5): scripts/train.py --config configs/train_ppo.yaml [--quick]
task_config: task_drop.yaml
seed: 0
# Spec target (16 envs, 20M steps). Measured on the shared 4-core dev container (M5):
# 4 envs ~130-150 steps/s (SubprocVecEnv, envs ~50 % busy) = 11-13 min per 100k steps
# => 20M steps ~ 37-43 h at 4 envs (~9-11 h on a 16-core box assuming linear scaling).
# Every run writes <run>/timing.json with its own projection.  Use --quick or
# --total-timesteps / --n-envs on small machines.
n_envs: 16
total_timesteps: 20000000
quick:                           # --quick: laptop CPU
  n_envs: 4
  total_timesteps: 200000
  eval_freq: 25000
  checkpoint_freq: 50000
ppo:
  learning_rate: 3.0e-4
  n_steps: 1024                  # per env -> rollout = n_steps * n_envs
  batch_size: 1024
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_hidden: [128, 128]
  log_std_init: -1.2             # std 0.30 (per 20 ms step; averaged by the plant). -2.0
                                 # (std 0.135) learned ~3x slower in the 200k quick run
action_init_scale: 0.0           # action-head weights scaled by this at init (0 => a == 0)
normalize:
  obs: true                      # VecNormalize obs (stats saved as vecnormalize.pkl)
  reward: false
  clip_obs: 10.0
# task-config overrides used for training only (eval/evaluate.py uses the task config as is)
task_overrides:
  reward:
    shaping_impulse: 0.004       # dense per-step gas penalty [1/(N*s)] (credit assignment);
    k3_impulse: 0.0              # ... replaces the terminal one
    k1_impact_speed2: 0.1        # 0.5 makes any extra impact speed cost more than the gas saved
    k_margin: 5.0                # quadratic penalty within margin_v/h/tilt of the safe limits
    margin_v: 0.3                # (keeps the faster-landing policy off the 2 m/s cliff)
    margin_h: 0.3
    margin_tilt_deg: 5.0
policy_dt: 0.02                  # [s] residual policy acts at 50 Hz (held between control steps)
eval_freq: 100000                # timesteps between periodic deterministic evals (0 = off)
eval_episodes: 50
eval_seed0: 100000               # eval seeds 100000.. (disjoint from test seeds 0..999)
eval_workers: 4
eval_baseline: true              # also evaluate the baseline on the eval seeds once
checkpoint_freq: 500000
out_dir: runs
