# PPO residual-policy training.
task_config: task_drop.yaml
seed: 0
n_envs: 16
total_timesteps: 20000000
quick:                           # --quick: laptop CPU
  n_envs: 4
  total_timesteps: 200000
ppo:
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 4096
  n_epochs: 5
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  policy_hidden: [128, 128]
policy_dt: 0.02                  # [s] residual policy acts at 50 Hz (held between control steps)
eval_episodes: 100
out_dir: runs
