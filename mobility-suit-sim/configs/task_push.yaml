# T3 — push recovery on a 0.3 m wide beam.
# The wearer stands on a static box 'beam' (axis along world x, the wearer faces +x) and gets
# a horizontal push (random direction in the horizontal plane, uniform) on the torso CoM.
# Domain randomisation (mass, thruster force / delay, sensor noise, friction) is inherited
# from task_drop.yaml::randomization; no drop / tilt initial state.
base: task_drop.yaml
task:
  name: push_recovery
  beam_width: 0.3                # [m]
  beam_height: 1.0               # [m] beam top above ground
  beam_length: 6.0               # [m] along world x
  push_force: 200.0              # [N]
  push_duration: 0.2             # [s]
  push_time: [0.5, 1.5]          # [s] onset, sampled uniform
  push_direction_deg: [0.0, 360.0]   # [deg] azimuth of the push force (0 = +x forward,
                                 # 90 = +y left), sampled uniform
  push_body: torso
  episode_time: 4.0
  initial_sway: 0.0              # [m/s] max initial horizontal CoM velocity (uniform disc)
  fixed: null                    # pins any of push_direction_deg, push_time, push_force,
                                 # mass_scale, friction, noise_scale, fmax_scale, tau_scale
# "Stayed on the beam" (evaluated on ground truth at episode end):
push_success:
  sole_height_tol: 0.04          # [m] each sole within this of the beam top (and not below it)
  foot_lateral_margin: 0.0       # [m] |foot centre y| <= beam_width/2 + this
  min_pelvis_height: 0.70        # [m] pelvis origin above the beam top
  max_tilt_deg: 30.0             # torso tilt
  fall_pelvis_height: 0.45       # [m] pelvis below this above the beam top -> fallen (ends)
  # any contact of a non-foot body with the beam / ground also counts as a fall (ends)
balance:
  mass_nominal: 100.0            # [kg]
  com_height_nominal: 1.0        # [m] fallback CoM height above the soles (LIPM w0 = sqrt(g/h))
  cop_margin: [0.04, 0.03]       # [m] (x, y) feet carry the CMP inside polygon shrunk by this;
                                 # the rest goes to the thrusters (0.07: +35 % jet gas)
  k_xi: 3.0                      # [1/s] capture-point convergence rate
  gain_u: [1.5, 1.5]             # thruster accel multiplier
  u_max: [6.0, 6.0]              # [m/s^2] cap of the requested thruster accel
  w_att: 0.0                     # torso-attitude rows in the allocation (0.15: +75 % jet gas)
  w_fz: 0.25                     # collective-lift row weight (pods used when jets saturate)
  lift_max: 600.0                # [N] collective lift cap
  hip_strategy_gain: [0.0, 0.0]  # posture-servo hip strategy (not needed with thrusters)
reward:
  success_bonus: 10.0
  fall_penalty: 10.0
  k_impulse: 0.002               # per N*s of gas
