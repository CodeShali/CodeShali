# T3 variant: +4 lateral micro jets (2 per side) at shoulder height to double the lateral
# push-recovery authority (default suit: only 2 jets per lateral direction, ~1.25 m/s^2
# "moment-about-feet" accel vs ~4-5 m/s^2 sagittal). Thrusters are appended (index order).
base: suit_default.yaml
suit:
  thrusters:
    jet_shoulder_l_side: {cls: micro_jet, body: torso, pos: [0.00,  0.24, 0.44], dir: [0, -1, 0]}
    jet_shoulder_r_side: {cls: micro_jet, body: torso, pos: [0.00, -0.24, 0.44], dir: [0, 1, 0]}
    jet_hip_l_side:      {cls: micro_jet, body: pelvis, pos: [0.00,  0.15, 0.00], dir: [0, -1, 0]}
    jet_hip_r_side:      {cls: micro_jet, body: pelvis, pos: [0.00, -0.15, 0.00], dir: [0, 1, 0]}
