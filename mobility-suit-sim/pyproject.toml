[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "suitsim"
version = "0.1.0"
description = "Physics simulator and control stack for a thruster-based wearable mobility suit"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.0",
  "gymnasium>=0.29",
  "stable-baselines3>=2.0",
  "numpy",
  "scipy",
  "pyyaml",
  "matplotlib",
  "imageio",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["suitsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running integration tests"]
